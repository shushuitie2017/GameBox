<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#06080E;color:#EAEFF8;
    font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    position:relative}
  .bg{position:absolute;inset:0;
    background:radial-gradient(700px 420px at 82% -6%,rgba(91,140,255,.28),transparent 60%),
      radial-gradient(560px 360px at 8% 6%,rgba(50,224,255,.16),transparent 55%);}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(130,160,220,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(130,160,220,.06) 1px,transparent 1px);background-size:52px 52px;
    -webkit-mask-image:radial-gradient(900px 520px at 50% 0%,#000,transparent 78%);}
  .wrap{position:relative;padding:82px 88px;height:100%;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:34px}
  .brand svg{width:56px;height:56px}
  .brand b{font-size:40px;font-weight:700;letter-spacing:.3px}
  h1{font-size:74px;line-height:1.04;font-weight:700;letter-spacing:-1.5px;max-width:960px;
    background:linear-gradient(180deg,#fff,#B9C6EA);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:26px;font-size:29px;color:#C2CBDE;max-width:900px}
  .chips{margin-top:44px;display:flex;gap:16px;align-items:center}
  .chip{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:22px;font-weight:600;
    padding:9px 20px;border-radius:12px}
  .c-mods{color:#EAEFF8;background:rgba(91,140,255,.16);border:1px solid rgba(91,140,255,.4)}
  .c-pure{color:#46E0A0;background:rgba(70,224,160,.12);border:1px solid rgba(70,224,160,.35)}
  .c-three{color:#5B8CFF;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.35)}
  .c-rapier{color:#F5A65B;background:rgba(245,166,91,.12);border:1px solid rgba(245,166,91,.35)}
  .foot{position:absolute;right:88px;bottom:64px;font-family:ui-monospace,monospace;font-size:22px;color:#6A7391}
</style></head><body>
  <div class="bg"></div><div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><polygon points="12,2.6 20.4,7.3 20.4,16.7 12,21.4 3.6,16.7 3.6,7.3" stroke="#5B8CFF" stroke-width="1.4" stroke-linejoin="round"/><path d="M12,12 L12,21.4 M12,12 L20.4,7.3 M12,12 L3.6,7.3" stroke="#32E0FF" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <b>GameBox</b>
    </div>
    <h1>Building-block code for browser 3D games</h1>
    <p>74 self-explanatory modules for coding agents — motion, cameras, gameplay, worlds.</p>
    <div class="chips">
      <span class="chip c-mods">74 modules · 7 categories</span>
      <span class="chip c-pure">pure</span>
      <span class="chip c-three">three</span>
      <span class="chip c-rapier">+ Rapier</span>
    </div>
    <div class="foot">gamebox.bluecatbot.com · MIT</div>
  </div>
</body></html>
